<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Story Studio — We Will Be Back Soon</title>

<!-- SEO -->
<meta name="description" content="Second Story Studio is temporarily closed for a full closet refresh. A curated dress rental archive based in Metro Manila, Philippines — back soon with new pieces.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://secondstorybooking.com/">
<meta name="theme-color" content="#f6f1e8">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Second Story Studio">
<meta property="og:title" content="Second Story Studio — We Will Be Back Soon">
<meta property="og:description" content="Temporarily closed for a full closet refresh. A curated dress rental archive based in Metro Manila, Philippines.">
<meta property="og:url" content="https://secondstorybooking.com/">
<meta property="og:image" content="https://secondstorybooking.com/assets/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_PH">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Second Story Studio — We Will Be Back Soon">
<meta name="twitter:description" content="Temporarily closed for a full closet refresh. A curated dress rental archive based in Metro Manila, Philippines.">
<meta name="twitter:image" content="https://secondstorybooking.com/assets/img/og-image.jpg">

<!-- Structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ClothingStore",
  "name": "Second Story Studio",
  "url": "https://secondstorybooking.com/",
  "email": "mailus@secondstorybooking.com",
  "image": "https://secondstorybooking.com/assets/img/og-image.jpg",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Metro Manila",
    "addressCountry": "PH"
  },
  "sameAs": [
    "https://www.instagram.com/secondstoryrentals"
  ]
}
</script>

<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon-180.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="banner reveal" style="--delay: 0s">
    We will be back shortly with a fresh closet archive. Thank you for your patience.
  </div>

  <main class="hero">
    <a href="index.html" class="logo-link" aria-label="Second Story home">
      <img class="monogram reveal" style="--delay: 0.12s" src="assets/img/monogram.png" alt="Second Story monogram">
    </a>
    <h1 class="hero-heading reveal" style="--delay: 0.22s">We're currently closed for a full closet refresh</h1>
  </main>

  <section class="gallery">
    <div class="tile reveal" style="--delay: 0.30s">
      <img src="assets/img/tile-1-doorway.jpg" alt="White satin dress hanging by the door">
    </div>
    <div class="tile reveal" style="--delay: 0.36s">
      <img src="assets/img/tile-2-tag.jpg" alt="Second Story fabric tag">
    </div>
    <div class="tile reveal" style="--delay: 0.42s">
      <img src="assets/img/tile-3-back.jpg" alt="Back detail of a white lace-up dress">
    </div>
    <div class="tile reveal" style="--delay: 0.48s">
      <img src="assets/img/tile-4-tape.jpg" alt="Second Story tape pattern">
    </div>
  </section>

  <footer class="site-footer reveal" style="--delay: 0.56s">
    <a href="index.html" class="logo-link" aria-label="Second Story home">
      <img class="wordmark" src="assets/img/wordmark.png" alt="Second Story">
    </a>
    <div class="footer-info">
      <p><a href="mailto:mailus@secondstorybooking.com">mailus@secondstorybooking.com</a></p>
      <p>Metro Manila, Philippines</p>
      <p>© 2026 Second Story Studio. Archived pieces, worn again.</p>
    </div>
  </footer>

</body>
</html>
