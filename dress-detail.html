const PLACEHOLDER_IMG_COUNT = 6;

function formatPrice(p) {
  return "₱" + p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function render() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const dress = DRESSES.find(d => d.id === id) || DRESSES[0];

  document.title = `Second Story Studio — ${dress.name}`;

  const hasImages = dress.images && dress.images.length > 0;
  const images = hasImages ? dress.images : null;

  const isVideo = src => /\.(mp4|webm|mov)$/i.test(src);
  const posterOf = src => src.replace("assets/video/", "assets/img/").replace(/\.(mp4|webm|mov)$/i, "-poster.jpg");
  const mediaHTML = src => isVideo(src)
    ? `<video poster="${posterOf(src)}" autoplay muted loop playsinline preload="metadata" aria-label="${dress.name} video"><source src="${src}" type="video/mp4"><source src="${src.replace(/\.mp4$/i, ".webm")}" type="video/webm"></video>`
    : `<img src="${src}" alt="${dress.name}">`;

  const mainPhotoHTML = hasImages ? mediaHTML(images[0]) : ``;

  const thumbsHTML = hasImages
    ? images.map((src, i) => `
        <button class="${i === 0 ? 'active' : ''}" data-src="${src}" aria-label="View photo ${i + 1}">
          <img src="${isVideo(src) ? posterOf(src) : src}" alt="${dress.name} ${isVideo(src) ? 'video' : 'photo ' + (i + 1)}">${isVideo(src) ? '<span class="thumb-play" aria-hidden="true"></span>' : ''}
        </button>`).join("")
    : Array.from({ length: PLACEHOLDER_IMG_COUNT }, () => `<button disabled></button>`).join("");

  const descHTML = dress.description
    ? `<p class="dress-description">${dress.description}</p>`
    : `<p class="dress-description is-empty">Description coming soon.</p>`;

  const sd = dress.sizeDesc;
  const isSet = sd && (sd.topLength || sd.skirtLength);
  const v = x => (x == null || x === "") ? "—" : x;
  const sizeHead = isSet
    ? `<th>Size</th><th>Top Length (in cm)</th><th>Skirt Length (in cm)</th><th>Waist (in cm)</th><th>Bust (in cm)</th>`
    : `<th>Size</th><th>Length (in cm)</th><th>Waist (in cm)</th><th>Bust (in cm)</th>`;
  const sizeRow = !sd
    ? `<td>—</td><td>—</td><td>—</td><td>—</td>`
    : isSet
      ? `<td>${v(sd.size)}</td><td>${v(sd.topLength)}</td><td>${v(sd.skirtLength)}</td><td>${v(sd.waist)}</td><td>${v(sd.bust)}</td>`
      : `<td>${v(sd.size)}</td><td>${v(sd.height)}</td><td>${v(sd.waist)}</td><td>${v(sd.bust)}</td>`;

  document.getElementById("detailWrap").innerHTML = `
    <div class="detail-layout">
      <div class="detail-gallery">
        <div class="main-photo" id="mainPhoto">${mainPhotoHTML}</div>
        <div class="thumb-strip">${thumbsHTML}</div>
      </div>

      <div class="detail-info">
        <div class="dress-name">${dress.name}</div>
        <div class="dress-source">${dress.source ? "From " + dress.source : "&nbsp;"}</div>
        <div class="dress-pricing">
          <div>Rent for: ${formatPrice(dress.price)}</div>
          ${dress.deposit != null ? `<div>Refundable Security Deposit: ${formatPrice(dress.deposit)}</div>` : ""}
          ${dress.badge ? `<div class="dress-arriving">${dress.badge}</div>` : dress.arriving ? `<div class="dress-arriving">Arriving ${dress.arriving}</div>` : ""}
        </div>

        ${descHTML}

        <h3>Size Description</h3>
        <table class="size-table">
          <thead><tr>${sizeHead}</tr></thead>
          <tbody><tr>${sizeRow}</tr></tbody>
        </table>

        <h3>Model Size</h3>
        <table class="size-table">
          <thead><tr><th>Size</th><th>Height (in cm)</th><th>Waist (in cm)</th><th>Bust (in cm)</th></tr></thead>
          <tbody><tr><td>${MODEL_SIZE.size}</td><td>${MODEL_SIZE.height}</td><td>${MODEL_SIZE.waist}</td><td>${MODEL_SIZE.bust}</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="detail-cta-row">
      ${dress.arriving
        ? `<a href="https://docs.google.com/forms/d/e/1FAIpQLSeGl86gedmSaa_Ox1_kwcuQUGthKKKsQtRHzOaMzC8k7yUMKA/viewform?usp=header" target="_blank" rel="noopener">Join the Waitlist &gt;</a>`
        : `<a href="https://docs.google.com/forms/d/e/1FAIpQLSd_ez1rhBiMMYynVgnU6CkGYyhC0YI6tfa6hxVlqMO-0Yb0FA/viewform?usp=header" target="_blank" rel="noopener">Request a Fitting Appointment &gt;</a>`}
      <a href="dress-availability.html">Check Dress Availability &gt;</a>
    </div>
  `;

  if (hasImages) {
    document.querySelectorAll(".thumb-strip button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.getElementById("mainPhoto").innerHTML = mediaHTML(btn.dataset.src);
        document.querySelectorAll(".thumb-strip button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
  }
}

render();
</script>

</body>
</html>
